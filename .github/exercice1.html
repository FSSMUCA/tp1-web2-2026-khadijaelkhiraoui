<!DOCTYPE html>
<html lang="fr">
<head>

    <title>TP JavaScript - Exercice 1</title>
    <style>
        .retour {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .retour:hover {

<body>

    <a href="index.html" class="retour">⬅️ Retour au catalogue</a>
    
    <script>
        // 1. Afficher "Bonjour, monde !" dans la console
